<script>
/* ============================================================
   Dr Chicken — administración de pedidos
   Funciona 100% offline (localStorage). La sincronización entre
   celulares se activa desde Ajustes pegando la config de Firebase.
   ============================================================ */

const HORARIO = { dias:'Viernes a Domingo', desde:'20:30', hasta:'23:30' };
const TEL_NEGOCIO = '59898158825';

const MENU_INICIAL = [
  { cat:'BOX S', nombre:'CRISPY',        desc:'4 pechugas, con papas fritas y salsa a elección.',                       precio:390,  salsas:1 },
  { cat:'BOX S', nombre:'ALITAS',        desc:'4 alitas, con papas fritas y salsa a elección.',                         precio:390,  salsas:1 },
  { cat:'BOX S', nombre:'DR. LEGS',      desc:'5 patitas, con papas fritas y salsa a elección.',                        precio:390,  salsas:1 },
  { cat:'BOX S', nombre:'DR. MIX',       desc:'2 alitas, 2 pechugas y 2 patitas, con papas fritas y salsa a elección.',  precio:430,  salsas:1 },
  { cat:'BOX M', nombre:'CHICKEN DUO',   desc:'5 pechugas y 4 alitas, con papas fritas y 2 salsas a elección.',         precio:690,  salsas:2 },
  { cat:'BOX M', nombre:'DOCTORE',       desc:'5 pechuga y 5 patitas, con papas fritas y 2 salsas a elección.',         precio:720,  salsas:2 },
  { cat:'BOX L', nombre:'EXTRA XL',      desc:'5 patitas, 5 pechugas y 4 alitas con papas fritas y 3 salsas a elección.', precio:1250, salsas:3 },
  { cat:'BOX L', nombre:'CHICKEN PARTY', desc:'5 alitas, 6 pechugas y 6 patitas, con papas fritas y 3 salsas a elección.', precio:1390, salsas:3 },
  { cat:'SALSAS', nombre:'BBQ',              desc:'Salsa extra.', precio:70, salsas:0 },
  { cat:'SALSAS', nombre:'Cheddar',          desc:'Salsa extra.', precio:70, salsas:0 },
  { cat:'SALSAS', nombre:'Alioli',           desc:'Salsa extra.', precio:50, salsas:0 },
  { cat:'SALSAS', nombre:'Salsa de la casa', desc:'Salsa extra.', precio:50, salsas:0 }
];

const ESTADOS = {
  nuevo:     { txt:'Pendiente', color:'bg-dr-500/15 text-dr-400 border-dr-500/30', next:'entregado', accion:'Entregado' },
  entregado: { txt:'Entregado', color:'bg-ok/15 text-ok border-ok/30',             next:null,        accion:null },
  cancelado: { txt:'Cancelado', color:'bg-bad/15 text-bad border-bad/30',          next:null,        accion:null }
};

/* WhatsApp: en el celular conviene wa.me, que abre la app. En la laptop ese link
   abre una pagina intermedia que pregunta como seguir y pide permisos cada vez,
   asi que se va derecho a WhatsApp Web. El target con nombre hace que reutilice
   siempre la misma pestaña en lugar de acumular una por pedido. */
const ES_MOVIL = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const MSG_SALIDA = 'Hola {cliente}! Soy de Dr Chicken 🍗 Ya salió tu pedido, en unos minutos estamos ahí.';

function telInternacional(tel){
  const n = String(tel || '').replace(/\D/g, '');
  if(!n) return '';
  return n.indexOf('598') === 0 ? n : '598' + n.replace(/^0+/, '');
}

function mensajeCliente(p){
  return (CFG.msgSalida || MSG_SALIDA)
    .replace(/\{cliente\}/g, (p.cliente || '').split(' ')[0])
    .replace(/\{total\}/g, money(totalPedido(p)))
    .replace(/\{pedido\}/g, '#' + p.num);
}

function linkWhatsApp(tel, texto){
  const n = telInternacional(tel);
  if(!n) return null;
  const t = encodeURIComponent(texto);
  return ES_MOVIL ? 'https://wa.me/' + n + '?text=' + t
                  : 'https://web.whatsapp.com/send?phone=' + n + '&text=' + t;
}

/* ---------- estado en memoria ---------- */
let DATA  = { pedidos:[], productos:[], costos:[], cierres:[] };
let CFG   = { envio:0, negocioId:'', fb:null, msgSalida:'' };
let UI    = { tab:'pedidos', filtro:'pendientes', jornadaCaja:null, mesCaja:null, cajaVista:'noche', borrador:null };
let CLOUD = { on:false, db:null, fns:null, unsubs:[], error:null, arrancada:{} };

/* ---------- helpers ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-UY');
const pad = n => String(n).padStart(2, '0');

/* La "jornada" corre de las 12:00 de un día a las 12:00 del siguiente, así un
   pedido cargado a las 00:30 sigue contando para la noche que arrancó ayer. */
function jornadaDe(ts){
  const d = new Date(ts);
  d.setHours(d.getHours() - 12);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
const jornadaHoy = () => jornadaDe(Date.now());

const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function jornadaLabel(j){
  if(!j) return '—';
  const p = j.split('-').map(Number);
  const f = new Date(p[0], p[1] - 1, p[2]);
  const txt = DIAS[f.getDay()] + ' ' + p[2] + '/' + pad(p[1]);
  return j === jornadaHoy() ? txt + ' · hoy' : txt;
}
const hora = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };

function toast(msg){
  DESHACER = null;
  $('#toastMsg').textContent = msg;
  $('#toast').classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => $('#toast').classList.add('hidden'), 1900);
}

/* Borrar es irreversible y, con la sincronización activa, borra para todos a la vez.
   Por eso cada borrado deja unos segundos para arrepentirse. */
let DESHACER = null;
function toastDeshacer(msg, alDeshacer){
  DESHACER = alDeshacer;
  $('#toastMsg').innerHTML = esc(msg) +
    ' <button id="btnDeshacer" class="ml-2 font-black text-dr-600 underline underline-offset-2">Deshacer</button>';
  $('#toast').classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { $('#toast').classList.add('hidden'); DESHACER = null; }, 7000);
}

/* ---------- persistencia local ---------- */
const K = k => 'drchicken:' + k;

function loadLocal(){
  try {
    DATA.pedidos   = JSON.parse(localStorage.getItem(K('pedidos'))   || '[]');
    DATA.productos = JSON.parse(localStorage.getItem(K('productos')) || '[]');
    DATA.costos    = JSON.parse(localStorage.getItem(K('costos'))    || '[]');
    DATA.cierres   = JSON.parse(localStorage.getItem(K('cierres'))   || '[]');
    CFG = Object.assign(CFG, JSON.parse(localStorage.getItem(K('config')) || '{}'));
  } catch(e){ console.warn('No se pudo leer el almacenamiento local', e); }
  /* Los pedidos guardados con los estados viejos vuelven a quedar pendientes. */
  let migrados = 0;
  DATA.pedidos.forEach(p => {
    if(p.estado === 'cocina' || p.estado === 'camino'){ p.estado = 'nuevo'; migrados++; }
  });
  if(migrados) saveLocal('pedidos');

  if(!DATA.productos.length){
    DATA.productos = MENU_INICIAL.map((p, i) => Object.assign({ id:uid(), orden:i, activo:true }, p));
    saveLocal('productos');
  }
}

function saveLocal(col){
  try {
    if(col === 'config') localStorage.setItem(K('config'), JSON.stringify(CFG));
    else localStorage.setItem(K(col), JSON.stringify(DATA[col]));
  } catch(e){ console.warn('No se pudo guardar', e); }
}

/* Escribe un registro: local siempre, y en la nube si está conectada. */
function putDoc(col, obj){
  obj.upd = Date.now();
  const i = DATA[col].findIndex(x => x.id === obj.id);
  if(i >= 0) DATA[col][i] = obj; else DATA[col].push(obj);
  saveLocal(col);
  if(CLOUD.on) cloudPut(col, obj);
  render();
}

function delDoc(col, id){
  DATA[col] = DATA[col].filter(x => x.id !== id);
  saveLocal(col);
  if(CLOUD.on) cloudDel(col, id);
  render();
}

/* ---------- consultas ---------- */
const pedidosDe = j => DATA.pedidos.filter(p => p.jornada === j).sort((a,b) => (a.num||0) - (b.num||0));
const productosOn = () => DATA.productos.filter(p => p.activo).sort((a,b) => (a.orden||0) - (b.orden||0));
const salsasDisponibles = () => DATA.productos.filter(p => p.cat === 'SALSAS' && p.activo).map(p => p.nombre);
const totalItems = p => (p.items || []).reduce((s,i) => s + i.precio * i.cant, 0);
const totalPedido = p => totalItems(p) + (Number(p.envio) || 0);
const proximoNum = j => pedidosDe(j).reduce((m,p) => Math.max(m, p.num || 0), 0) + 1;

function jornadasConDatos(){
  const set = new Set(DATA.pedidos.map(p => p.jornada).concat(DATA.costos.map(c => c.jornada), [jornadaHoy()]));
  return Array.from(set).filter(Boolean).sort().reverse();
}

function resumenJornada(j){
  const ps = pedidosDe(j).filter(p => p.estado !== 'cancelado');
  const ventas   = ps.reduce((s,p) => s + totalPedido(p), 0);
  const efectivo = ps.filter(p => p.pago === 'efectivo').reduce((s,p) => s + totalPedido(p), 0);
  const transf   = ps.filter(p => p.pago === 'transferencia').reduce((s,p) => s + totalPedido(p), 0);
  const sinPago  = ps.filter(p => !p.pago).reduce((s,p) => s + totalPedido(p), 0);
  const costos   = DATA.costos.filter(c => c.jornada === j).reduce((s,c) => s + (Number(c.monto) || 0), 0);
  const boxes    = ps.reduce((s,p) => s + (p.items||[]).filter(i => i.cat !== 'SALSAS').reduce((n,i) => n + i.cant, 0), 0);
  return {
    ps, ventas, efectivo, transf, sinPago, costos, boxes,
    entregados: ps.filter(p => p.estado === 'entregado').length,
    neto: ventas - costos,
    cant: ps.length,
    ticket: ps.length ? ventas / ps.length : 0
  };
}

/* Cuánto se vendió de cada box: unidades y plata, de mayor a menor. */
function ventasPorProducto(pedidos){
  const m = new Map();
  pedidos.forEach(p => (p.items || []).forEach(i => {
    const x = m.get(i.nombre) || { nombre:i.nombre, cat:i.cat, cant:0, total:0 };
    x.cant += i.cant;
    x.total += i.precio * i.cant;
    m.set(i.nombre, x);
  }));
  return Array.from(m.values()).sort((a,b) => b.total - a.total);
}

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mesLabel = m => { const p = m.split('-'); return MESES[Number(p[1]) - 1] + ' ' + p[0]; };

function mesesConDatos(){
  return Array.from(new Set(jornadasConDatos().map(j => j.slice(0, 7)))).sort().reverse();
}

function jornadasDelMes(mes){
  return jornadasConDatos().filter(j => j.indexOf(mes) === 0 && resumenJornada(j).cant > 0).sort();
}

/* Suma todas las noches del mes y arma el ranking de productos del período. */
function resumenMes(mes){
  const js = jornadasDelMes(mes);
  const t = { ventas:0, efectivo:0, transf:0, sinPago:0, costos:0, neto:0, cant:0, boxes:0, noches:js.length, js:js };
  js.forEach(j => {
    const r = resumenJornada(j);
    ['ventas','efectivo','transf','sinPago','costos','neto','cant','boxes'].forEach(k => t[k] += r[k]);
  });
  t.ticket = t.cant ? t.ventas / t.cant : 0;
  t.mejorNoche = js.slice().sort((a,b) => resumenJornada(b).neto - resumenJornada(a).neto)[0] || null;
  const pedidos = js.reduce((acc,j) => acc.concat(pedidosDe(j).filter(p => p.estado !== 'cancelado')), []);
  t.productos = ventasPorProducto(pedidos);
  return t;
}

const cierreDe = j => DATA.cierres.find(c => c.jornada === j);

/* ---------- clientes conocidos (autocompletado) ---------- */
function clientesConocidos(){
  const m = new Map();
  DATA.pedidos.slice().sort((a,b) => b.ts - a.ts).forEach(p => {
    const k = (p.cliente || '').trim().toLowerCase();
    if(k && !m.has(k)) m.set(k, { cliente:p.cliente, tel:p.tel || '', dir:p.dir || '' });
  });
  return Array.from(m.values());
}

/* ============================ RENDER ============================ */

function render(){
  $('#hdrJornada').textContent = jornadaLabel(jornadaHoy()) + ' · ' + HORARIO.desde + ' a ' + HORARIO.hasta;
  $$('.tabpane').forEach(s => s.classList.toggle('hidden', s.dataset.tab !== UI.tab));
  $$('.tabbtn').forEach(b => {
    const on = b.dataset.goto === UI.tab;
    b.classList.toggle('text-dr-500', on);
    b.classList.toggle('text-zinc-400', !on);
  });
  /* El repartidor no carga pedidos, y ahí el botón flotante tapaba el de Entregado. */
  $('#fab').classList.toggle('hidden', UI.tab !== 'pedidos');
  if(UI.tab === 'pedidos') renderPedidos();
  if(UI.tab === 'caja')    renderCaja();
  if(UI.tab === 'menu')    renderMenu();
}

function tile(label, valor, extra){
  return '<div class="bg-ink-800 border border-ink-600 rounded-xl p-2.5">' +
    '<p class="text-[10px] uppercase tracking-wide text-zinc-400 font-semibold">' + esc(label) + '</p>' +
    '<p class="text-lg font-extrabold tabular leading-tight mt-0.5">' + esc(valor) + '</p>' +
    (extra ? '<p class="text-[10px] text-zinc-500 leading-tight">' + esc(extra) + '</p>' : '') +
  '</div>';
}

function vacio(txt, sub){
  return '<div class="col-span-full text-center py-14 px-6">' +
    '<div class="text-4xl mb-3 opacity-40">🍗</div>' +
    '<p class="text-sm text-zinc-300 font-semibold">' + esc(txt) + '</p>' +
    (sub ? '<p class="text-xs text-zinc-500 mt-1">' + esc(sub) + '</p>' : '') +
  '</div>';
}

/* ---------------------------- PEDIDOS ---------------------------- */

const FILTROS = [
  { id:'pendientes', txt:'Pendientes' },
  { id:'entregado',  txt:'Entregados' },
  { id:'todos',      txt:'Todos' }
];

function renderPedidos(){
  const j = jornadaHoy();
  const r = resumenJornada(j);
  $('#resumenNoche').innerHTML =
    tile('Pedidos', String(r.cant), r.entregados + (r.entregados === 1 ? ' entregado' : ' entregados')) +
    tile('Vendido', money(r.ventas), r.boxes + ' box') +
    tile('A cobrar', money(r.sinPago), r.sinPago ? 'sin pago cargado' : 'todo cargado');

  const todos = pedidosDe(j);
  const cuenta = id => id === 'todos' ? todos.length
    : id === 'pendientes' ? todos.filter(p => p.estado === 'nuevo').length
    : todos.filter(p => p.estado === id).length;

  $('#filtros').innerHTML = FILTROS.map(f => {
    const n = cuenta(f.id);
    const on = UI.filtro === f.id;
    return '<button data-filtro="' + f.id + '" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border ' +
      (on ? 'bg-dr-500 text-ink-900 border-dr-500' : 'bg-ink-800 text-zinc-300 border-ink-600') + '">' +
      esc(f.txt) + (n ? ' <span class="opacity-70">' + n + '</span>' : '') + '</button>';
  }).join('');

  const lista = UI.filtro === 'todos' ? todos
    : UI.filtro === 'pendientes' ? todos.filter(p => p.estado === 'nuevo')
    : todos.filter(p => p.estado === UI.filtro);

  $('#listaPedidos').innerHTML = lista.length
    ? lista.map(cardPedido).join('')
    : vacio('No hay pedidos ' + (UI.filtro === 'todos' ? 'en esta noche' : 'en este estado'), 'Tocá el botón Pedido para cargar el primero.');
}

function resumenItems(p){
  return (p.items || []).map(i => i.cant + '× ' + i.nombre).join(' · ');
}

/* Igual que el resumen, pero con las salsas elegidas: es lo que el repartidor
   necesita para controlar la bolsa antes de salir. */
function detalleItems(p){
  return (p.items || []).map(i => {
    const s = (i.salsas || []).length ? ' (' + i.salsas.join(', ') + ')' : '';
    return i.cant + '× ' + i.nombre + s;
  }).join(' · ');
}

/* Un pedido tiene salsas pendientes si algún box no completó las que elige el cliente. */
function salsasPendientes(p){
  return (p.items || []).some(i => (i.salsasReq || 0) * i.cant > (i.salsas || []).length);
}

function cardPedido(p){
  const e = ESTADOS[p.estado] || ESTADOS.nuevo;
  const falta = salsasPendientes(p);
  const wa = p.estado === 'entregado' ? null : linkWhatsApp(p.tel, mensajeCliente(p));
  return '<div data-pedido="' + p.id + '" class="bg-ink-800 border border-ink-600 rounded-2xl p-3 active:bg-ink-700">' +
    '<div class="flex items-start gap-2">' +
      '<span class="shrink-0 w-8 h-8 rounded-lg bg-ink-700 grid place-items-center text-sm font-extrabold tabular">' + (p.num || '?') + '</span>' +
      '<div class="min-w-0 flex-1">' +
        '<p class="font-bold leading-tight truncate">' + esc(p.cliente || 'Sin nombre') + '</p>' +
        '<p class="text-xs text-zinc-400 leading-tight truncate">' + esc(p.dir || 'Sin dirección') + '</p>' +
      '</div>' +
      '<div class="shrink-0 text-right">' +
        '<p class="font-extrabold tabular leading-tight">' + money(totalPedido(p)) + '</p>' +
        '<p class="text-[10px] text-zinc-500 leading-tight">' + hora(p.ts) + '</p>' +
      '</div>' +
    '</div>' +
    '<p class="text-xs text-zinc-300 mt-2 leading-snug">' + esc(resumenItems(p) || 'Sin productos') + '</p>' +
    (p.notas ? '<p class="text-xs text-dr-400 mt-1 leading-snug">📝 ' + esc(p.notas) + '</p>' : '') +
    '<div class="flex items-center gap-1.5 mt-2.5 flex-wrap">' +
      '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ' + e.color + '">' + e.txt + '</span>' +
      (p.pago ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold border border-ink-500 text-zinc-300">' + (p.pago === 'efectivo' ? '💵 Efectivo' : '📱 Transferencia') + '</span>'
              : '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold border border-bad/30 bg-bad/10 text-bad">Falta pago</span>') +
      (falta ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold border border-warn/30 bg-warn/10 text-warn">Faltan salsas</span>' : '') +
      '<div class="flex-1"></div>' +
      (wa ? '<a href="' + wa + '" target="whatsapp" rel="noopener" data-stop class="px-2.5 py-1.5 rounded-lg bg-ink-700 border border-ink-600 text-xs font-bold active:bg-ink-600 hover:bg-ink-600" title="Avisar que sale">💬</a>' : '') +
      (e.next ? '<button data-avanzar="' + p.id + '" class="px-3 py-1.5 rounded-lg bg-dr-500 text-ink-900 text-xs font-extrabold active:scale-95 transition">' + e.accion + '</button>' : '') +
    '</div>' +
  '</div>';
}

/* ------------------------------ CAJA ------------------------------ */

function renderCaja(){

const filaCaja = (l, v, cls) => '<div class="flex justify-between items-center py-2 border-b border-ink-700 last:border-0">' +
  '<span class="text-sm text-zinc-300">' + esc(l) + '</span>' +
  '<span class="text-sm font-bold tabular ' + (cls || '') + '">' + esc(v) + '</span></div>';

/* Ranking de box vendidos, con barra proporcional al que más facturó. */
function rankingHTML(productos, titulo){
  if(!productos.length) return '';
  const max = productos[0].total || 1;
  return '<div class="bg-ink-800 border border-ink-600 rounded-2xl p-3">' +
    '<p class="text-xs font-bold uppercase tracking-wide text-zinc-400 mb-2">' + esc(titulo) + '</p>' +
    productos.map(p =>
      '<div class="py-1.5">' +
        '<div class="flex justify-between items-baseline gap-2">' +
          '<span class="text-sm font-semibold truncate">' + esc(p.nombre) + '</span>' +
          '<span class="text-xs text-zinc-400 tabular shrink-0">' + p.cant + ' × · <span class="text-zinc-200 font-bold">' + money(p.total) + '</span></span>' +
        '</div>' +
        '<div class="mt-1 h-1.5 rounded-full bg-ink-700 overflow-hidden">' +
          '<div class="h-full rounded-full ' + (p.cat === 'SALSAS' ? 'bg-ink-500' : 'bg-dr-500') + '" style="width:' + Math.max(3, Math.round(p.total / max * 100)) + '%"></div>' +
        '</div>' +
      '</div>').join('') +
  '</div>';
}

/* Cerrar la jornada no borra ni congela nada: deja la marca de que esa noche se
   dio por terminada, junto a una foto de los números de ese momento. */
function cerrarJornada(j){
  const r = resumenJornada(j);
  const pendientes = pedidosDe(j).filter(p => p.estado === 'nuevo');
  const sinPago = r.ps.filter(p => !p.pago);

  const avisos = [];
  if(pendientes.length) avisos.push('• ' + pendientes.length + (pendientes.length === 1 ? ' pedido sin entregar' : ' pedidos sin entregar'));
  if(sinPago.length) avisos.push('• ' + sinPago.length + (sinPago.length === 1 ? ' pedido sin forma de pago' : ' pedidos sin forma de pago') + ' (' + money(r.sinPago) + ')');

  const txt = avisos.length
    ? 'Ojo, antes de cerrar:\n\n' + avisos.join('\n') + '\n\n¿Cerrar la noche igual?'
    : '¿Terminar la jornada?\n\nGanancia: ' + money(r.neto) + '\n' + r.cant + ' pedidos · ' + money(r.ventas) + ' vendido';
  if(!confirm(txt)) return;

  putDoc('cierres', {
    id: j, jornada: j, ts: Date.now(),
    resumen: { ventas:r.ventas, costos:r.costos, neto:r.neto, cant:r.cant,
               efectivo:r.efectivo, transf:r.transf, boxes:r.boxes }
  });
  toast('Jornada cerrada · ' + money(r.neto));
}

function textoCierreNoche(j){
  const r = resumenJornada(j);
  return ['*Dr Chicken* · cierre ' + jornadaLabel(j).replace(' · hoy',''), '',
    'Pedidos: ' + r.cant + '  (' + r.boxes + ' box)',
    'Efectivo: ' + money(r.efectivo),
    'Transferencia: ' + money(r.transf),
    'Vendido: ' + money(r.ventas),
    'Costos: ' + money(r.costos),
    '', 'Ganancia: ' + money(r.neto)].join('\n');
}

function textoResumenMes(mes){
  const t = resumenMes(mes);
  const l = ['*Dr Chicken* · ' + mesLabel(mes), '',
    t.noches + (t.noches === 1 ? ' noche' : ' noches') + ' · ' + t.cant + ' pedidos',
    'Vendido: ' + money(t.ventas),
    'Efectivo: ' + money(t.efectivo) + '  |  Transferencia: ' + money(t.transf),
    'Costos: ' + money(t.costos),
    '', 'Ganancia: ' + money(t.neto), ''];
  if(t.productos.length){
    l.push('Lo más vendido:');
    t.productos.slice(0, 5).forEach(p => l.push('  ' + p.cant + '× ' + p.nombre + '  ' + money(p.total)));
  }
  return l.join('\n');
}

function abrirPedido(id){
  const p = id ? DATA.pedidos.find(x => x.id === id) : null;
  UI.borrador = p
    ? JSON.parse(JSON.stringify(p))
    : { id:uid(), num:proximoNum(jornadaHoy()), jornada:jornadaHoy(), ts:Date.now(),
        cliente:'', tel:'', dir:'', notas:'', items:[], envio:Number(CFG.envio) || 0,
        pago:'', estado:'nuevo' };
  abrirSheet(p ? 'Pedido #' + p.num : 'Nuevo pedido', formPedidoHTML(!!p));

/* Pinta sólo la parte dinámica (items, salsas, chips y total). No toca los
   campos de texto: sus valores viven en el DOM y se leen recién al guardar,
   así nada de lo tipeado se pierde al agregar un producto o una salsa. */
function renderBorrador(){
  const b = UI.borrador; if(!b) return;

  $$('.btnPago').forEach(x => {
    const on = (x.dataset.pago || '') === (b.pago || '');
    x.className = 'btnPago py-2.5 rounded-xl border text-xs font-bold ' + (on ? 'bg-dr-500 text-ink-900 border-dr-500' : 'bg-ink-700 border-ink-600 text-zinc-300');
  });
  $$('.btnEstado').forEach(x => {
    const on = x.dataset.estado === b.estado;
    x.className = 'btnEstado py-2 rounded-lg border text-[10px] font-bold ' + (on ? 'bg-dr-500 text-ink-900 border-dr-500' : 'bg-ink-700 border-ink-600 text-zinc-300');
  });

  const salsas = salsasDisponibles();
  $('#pedItems').innerHTML = b.items.length ? b.items.map((it, idx) => {
    const req = (it.salsasReq || 0) * it.cant;
    const tocado = it.precioBase != null && it.precio !== it.precioBase;
    const puestas = it.salsas || [];
    const cuenta = {};
    puestas.forEach(s => cuenta[s] = (cuenta[s] || 0) + 1);
    return '<div class="bg-ink-700 border border-ink-600 rounded-xl p-2.5">' +
      '<div class="flex items-center gap-2">' +
        '<div class="min-w-0 flex-1">' +
          '<p class="text-sm font-bold leading-tight truncate">' + esc(it.nombre) + '</p>' +
          '<div class="flex items-center gap-1 mt-1 text-[11px] text-zinc-400">' +
            '<span>$</span>' +
            '<input data-precio="' + idx + '" value="' + it.precio + '" inputmode="numeric" ' +
              'class="w-14 bg-ink-600 border rounded px-1.5 py-0.5 tabular text-zinc-100 text-[11px] ' +
              (tocado ? 'border-dr-500 text-dr-400 font-bold' : 'border-ink-500') + '">' +
            '<span>c/u · <span class="font-bold text-zinc-200 tabular">' + money(it.precio * it.cant) + '</span></span>' +
            (tocado ? '<button data-resetprecio="' + idx + '" class="ml-1 text-[10px] text-dr-400 underline underline-offset-2">volver a ' + money(it.precioBase) + '</button>' : '') +
          '</div>' +

        '<div class="flex items-center gap-1 shrink-0">' +
          '<button data-cant="' + idx + '|-1" class="w-8 h-8 rounded-lg bg-ink-600 font-bold active:bg-ink-500">−</button>' +
          '<span class="w-6 text-center font-extrabold tabular">' + it.cant + '</span>' +
          '<button data-cant="' + idx + '|1" class="w-8 h-8 rounded-lg bg-ink-600 font-bold active:bg-ink-500">+</button>' +
        '</div>' +
      '</div>' +
      (req ? '<div class="mt-2 pt-2 border-t border-ink-600">' +
        '<p class="text-[10px] font-bold uppercase tracking-wide ' + (puestas.length === req ? 'text-zinc-500' : 'text-warn') + ' mb-1.5">Salsas incluidas ' + puestas.length + '/' + req + '</p>' +
        '<div class="flex flex-wrap gap-1.5">' +
          salsas.map(s => '<button data-salsa="' + idx + '|' + esc(s) + '" class="px-2.5 py-1 rounded-full text-[11px] font-bold border ' +
            (cuenta[s] ? 'bg-dr-500 text-ink-900 border-dr-500' : 'bg-ink-600 border-ink-500 text-zinc-300') + '">' +
            esc(s) + (cuenta[s] > 1 ? ' ×' + cuenta[s] : '') + '</button>').join('') +

    '</div>';
  }).join('') : '<p class="text-xs text-zinc-500 py-2">Todavía no agregaste productos. Tocá un box de arriba.</p>';

function addItem(pid){
  const b = UI.borrador, p = DATA.productos.find(x => x.id === pid);
  if(!b || !p) return;
  const it = b.items.find(i => i.pid === pid);
  if(it) it.cant++;
  else b.items.push({ pid:p.id, nombre:p.nombre, precio:p.precio, precioBase:p.precio, cat:p.cat, cant:1, salsasReq:p.salsas || 0, salsas:[] });
  renderBorrador();
}

function cambiarCant(idx, delta){
  const b = UI.borrador; if(!b) return;
  const it = b.items[idx]; if(!it) return;
  it.cant += delta;
  if(it.cant <= 0) b.items.splice(idx, 1);
  else {
    const max = (it.salsasReq || 0) * it.cant;
    if((it.salsas || []).length > max) it.salsas = it.salsas.slice(0, max);
  }
  renderBorrador();
}

function tocarSalsa(idx, salsa){
  const b = UI.borrador; if(!b) return;
  const it = b.items[idx]; if(!it) return;
  const max = (it.salsasReq || 0) * it.cant;
  it.salsas = it.salsas || [];
  if(it.salsas.length >= max) it.salsas = [salsa];
  else it.salsas.push(salsa);
  renderBorrador();
}

function guardarPedido(){
  const b = UI.borrador; if(!b) return;
  b.cliente = ($('#inpCliente') || {}).value || '';
  b.tel     = ($('#inpTel') || {}).value || '';

  b.total = totalPedido(b);
  if(b.estado === 'entregado' && !b.tsEntrega) b.tsEntrega = Date.now();
  putDoc('pedidos', b);
  cerrarSheet();
  toast('Pedido #' + b.num + ' guardado');
}

function textoPedido(p){
  const l = ['*Dr Chicken* · Pedido #' + p.num, ''];
  (p.items || []).forEach(i => {
    l.push(i.cant + '× ' + i.nombre + '  ' + money(i.precio * i.cant));
    if((i.salsas || []).length) l.push('   salsas: ' + i.salsas.join(', '));
  });
  if(p.envio) l.push('Envío  ' + money(p.envio));
  l.push('', 'Total: ' + money(totalPedido(p)));
  if(p.pago) l.push('Pago: ' + p.pago);
  if(p.dir) l.push('Dirección: ' + p.dir);
  if(p.notas) l.push('Notas: ' + p.notas);
  return l.join('\n');
}

/* Acepta la configuracion pegada tal cual la da Firebase: el bloque entero con
   los import, el objeto JS con las claves sin comillas, o JSON limpio. */
function parseConfigFirebase(txt){
  txt = String(txt || '').trim();
  if(!txt) return null;
  const k = txt.indexOf('firebaseConfig');
  const desde = txt.indexOf('{', k >= 0 ? k : 0);
  if(desde < 0) return null;
  const hasta = txt.indexOf('}', desde);
  if(hasta < 0) return null;
  const cuerpo = txt.slice(desde + 1, hasta);
  const out = {};
  const re = /["']?([A-Za-z_$][A-Za-z0-9_$]*)["']?\s*:\s*["']([^"']*)["']/g;
  let m;
  while((m = re.exec(cuerpo))) out[m[1]] = m[2];
  return (out.apiKey && out.projectId) ? out : null;
}

function importarDatos(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const j = JSON.parse(fr.result);
      if(!j.DATA) throw new Error('formato');
      DATA = Object.assign(DATA, j.DATA);
      ['pedidos','productos','costos','cierres'].forEach(saveLocal);
      cerrarSheet(); render(); toast('Datos importados');
    } catch(e){ toast('El archivo no es válido'); }
  };
  fr.readAsText(file);
}

/* ==================== SINCRONIZACIÓN (Firebase) ==================== */

const FB_VER = 'https://www.gstatic.com/firebasejs/10.12.2/';

/* Un cartel que solo dice "Error" no ayuda a nadie: se guarda el motivo real que
   devuelve Firestore y se traduce a algo accionable, que se lee en Ajustes. */
const MOTIVOS_FB = {
  'permission-denied': 'Firestore está rechazando la conexión. Casi siempre es que el código del negocio no coincide con el de las reglas, o que las reglas no se publicaron.',
  'unauthenticated':   'Firestore pide autenticación: revisá que las reglas sean las que corresponden a este código de negocio.',
  'not-found':         'No existe la base de datos. Creala en Firestore Database (ID (default)).',
  'failed-precondition':'Falta crear la base de datos en Firestore Database.',
  'unavailable':       'No hay conexión con Firestore. Puede ser internet o el servicio caído: reintenta solo.',
  'invalid-argument':  'Algún dato de la configuración de Firebase está mal.',
  'resource-exhausted':'Se pasaron de la cuota gratis del día. Se restablece sola.'
};

function anotarErrorCloud(e, donde){
  const code = (e && e.code) ? String(e.code).replace('firestore/', '') : '';
  CLOUD.error = {
    code: code || (e && e.message ? e.message.slice(0, 120) : 'desconocido'),
    msg: MOTIVOS_FB[code] || (e && e.message ? e.message : 'Error desconocido.'),
    donde: donde
  };
  console.warn('[sync]', donde, e);
  pintarSync('err', 'Error');
}

function pintarSync(estado, txt){
  if(estado !== 'err') CLOUD.error = null;
  const colores = { off:'bg-zinc-500', on:'bg-ok', wait:'bg-warn animate-pulse', err:'bg-bad' };
  $('#syncDot').className = 'w-2 h-2 rounded-full ' + (colores[estado] || colores.off);
  $('#syncTxt').textContent = txt;
}

async function conectarCloud(silencioso){
  if(!CFG.fb || !CFG.negocioId){ pintarSync('off', 'Local'); return false; }
  pintarSync('wait', 'Conectando');
  try {
    const appMod = await import(FB_VER + 'firebase-app.js');
    const fs = await import(FB_VER + 'firebase-firestore.js');
    desconectarCloud(true);
    const app = appMod.getApps && appMod.getApps().length ? appMod.getApps()[0] : appMod.initializeApp(CFG.fb);
    CLOUD.db = fs.getFirestore(app);
    CLOUD.fns = fs;
    CLOUD.on = true;

    /* Al conectar un dispositivo que ya venia cargando solo, sus pedidos no estan
       en la nube y la suscripcion los pisaria. Se revisa antes y se pregunta. */
    if(!silencioso){
      const soloLocales = async col => {
        const snap = await fs.getDocs(fs.collection(CLOUD.db, 'negocios', CFG.negocioId, col));
        if(snap.empty) return { vacia: true, solos: [] };
        const enNube = {};
        snap.docs.forEach(d => enNube[d.id] = true);
        return { vacia: false, solos: DATA[col].filter(x => !enNube[x.id]) };
      };
      const ped = await soloLocales('pedidos');
      const cos = await soloLocales('costos');
      if(!ped.vacia && ped.solos.length){
        const n = ped.solos.length;
        if(confirm('Este dispositivo tiene ' + n + (n === 1 ? ' pedido guardado' : ' pedidos guardados') +
                   ' que no están en la cuenta compartida.\n\n' +
                   'Aceptar: se suben y los ven todos.\n' +
                   'Cancelar: se descartan y queda lo que ya hay en la cuenta.')){
          ped.solos.forEach(p => cloudPut('pedidos', p));
          cos.solos.forEach(c => cloudPut('costos', c));
        }
      }
    }

    CLOUD.arrancada = {};
    ['pedidos','productos','costos','cierres'].forEach(col => {
      const ref = fs.collection(CLOUD.db, 'negocios', CFG.negocioId, col);
      const unsub = fs.onSnapshot(ref, snap => aplicarSnapshot(col, snap.docs.map(d => d.data())),
                                  err => anotarErrorCloud(err, 'leyendo ' + col));
      CLOUD.unsubs.push(unsub);
    });

    pintarSync('on', 'En línea');
    CFG.sincronizadoCon = CFG.negocioId;   /* de acá en adelante, la nube manda */
    saveLocal('config');
    if(!silencioso) toast('Sincronización activada');
    return true;
  } catch(e){
    CLOUD.on = false;
    anotarErrorCloud(e, 'conectando');
    if(!silencioso) toast('No se pudo conectar. Mirá el detalle en Ajustes.');
    return false;
  }
}

/* Configurar 5 dispositivos a mano es tedioso y se presta a errores de tipeo, asi
   que la configuracion viaja en un link. Quien lo abre queda conectado a la misma
   cuenta. El link lleva la llave del negocio: se manda solo al equipo. */
function linkDeConfig(){
  const datos = btoa(unescape(encodeURIComponent(JSON.stringify({ fb:CFG.fb, n:CFG.negocioId }))));
  return location.origin + location.pathname + '#s=' + datos;
}

function aplicarConfigDeLink(){
  const h = location.hash || '';
  if(h.indexOf('#s=') !== 0) return false;
  /* Que no quede a la vista ni se vuelva a aplicar al recargar. replaceState falla
     en algunos contextos (archivo local), así que hay un plan B. */
  try { history.replaceState(null, '', location.pathname + location.search); }
  catch(e){ location.hash = ''; }
  try {
    const d = JSON.parse(decodeURIComponent(escape(atob(h.slice(3)))));
    if(!d || !d.fb || !d.n) return false;
    if(CFG.negocioId === d.n && CFG.fb) return false;  /* ya estaba conectado a lo mismo */
    if(!confirm('¿Conectar este dispositivo a Dr Chicken?\n\nVas a ver los mismos pedidos que el resto del equipo.')) return false;
    CFG.fb = d.fb;
    CFG.negocioId = d.n;
    saveLocal('config');
    return true;
  } catch(e){ return false; }
}

/* En iPhone, la app agregada a la pantalla de inicio guarda sus datos aparte de
   Safari: abre vacia y sin configurar. Llevando la config en el start_url, el
   acceso directo se configura solo la primera vez que se abre. */
let LINK_MANIFIESTO = null;
function actualizarManifiesto(){
  const base = location.href.replace(/[#?].*$/, '').replace(/[^/]*$/, '');
  const arranque = (CFG.fb && CFG.negocioId) ? linkDeConfig() : base;
  const manifest = {
    name:'Dr Chicken · Pedidos', short_name:'Dr Chicken', start_url:arranque, display:'standalone',
    background_color:'#111113', theme_color:'#111113',
    icons:[{ src:base + 'icono.png', sizes:'256x256', type:'image/png', purpose:'any' }]
  };
  if(LINK_MANIFIESTO){ URL.revokeObjectURL(LINK_MANIFIESTO.href); LINK_MANIFIESTO.remove(); }
  LINK_MANIFIESTO = document.createElement('link');
  LINK_MANIFIESTO.rel = 'manifest';
  LINK_MANIFIESTO.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:'application/json' }));
  document.head.appendChild(LINK_MANIFIESTO);
}

/* Permite pegar el link de invitacion directamente en Ajustes, que es la salida
   cuando el acceso directo ya se creo sin configuracion. */
function parseLinkConfig(txt){
  const m = String(txt || '').match(/#s=([A-Za-z0-9+/=]+)/);
  if(!m) return null;
  try {
    const d = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    return (d && d.fb && d.n) ? d : null;
  } catch(e){ return null; }
}

function desconectarCloud(interno){
  CLOUD.unsubs.forEach(u => { try { u(); } catch(e){} });
  CLOUD.unsubs = [];
  CLOUD.arrancada = {};
  if(!interno){
    CLOUD.on = false; CLOUD.db = null; CLOUD.fns = null;
    pintarSync('off', 'Local');
  }
}

/* Que llega de la nube y que se hace con eso.

   La subida de lo local solo tiene sentido la primera vez que este dispositivo se
   sincroniza con este negocio y encuentra la coleccion vacia. Si se hiciera en cada
   aviso, borrar el ultimo pedido lo resucitaria: los demas dispositivos verian la
   coleccion vacia, creerian que hay que poblarla y volverian a subir lo que todavia
   tienen en memoria. */
function aplicarSnapshot(col, docs){
  const primero = !CLOUD.arrancada[col];
  CLOUD.arrancada[col] = true;

  if(primero && !docs.length && DATA[col].length && CFG.sincronizadoCon !== CFG.negocioId){
    DATA[col].forEach(o => cloudPut(col, o));
    return 'subido';
  }

  DATA[col] = docs;
  saveLocal(col);
  render();
  return 'aplicado';
}

function cloudPut(col, obj){
  if(!CLOUD.on) return;
  const fs = CLOUD.fns;
  fs.setDoc(fs.doc(CLOUD.db, 'negocios', CFG.negocioId, col, obj.id), JSON.parse(JSON.stringify(obj)))
    .catch(e => anotarErrorCloud(e, 'guardando en ' + col));
}

function cloudDel(col, id){
  if(!CLOUD.on) return;
  const fs = CLOUD.fns;
  fs.deleteDoc(fs.doc(CLOUD.db, 'negocios', CFG.negocioId, col, id))
    .catch(e => anotarErrorCloud(e, 'borrando en ' + col));
}

/* ========================== EVENTOS ========================== */

document.addEventListener('click', ev => {
  const t = ev.target;
  const cl = sel => t.closest(sel);

  /* navegación */
  const tab = cl('[data-goto]');
  if(tab){ UI.tab = tab.dataset.goto; render(); window.scrollTo(0,0); return; }

  if(cl('#fab') || cl('#btnNuevoTop')){ abrirPedido(); return; }
  if(cl('#btnAjustes')){ abrirAjustes(); return; }
  if(cl('#btnSync')){ abrirAjustes(); return; }
  if(cl('#sheetClose') || t.id === 'overlay'){ cerrarSheet(); return; }

  /* pedidos */
  const filtro = cl('[data-filtro]');
  if(filtro){ UI.filtro = filtro.dataset.filtro; render(); return; }

  const avanzar = cl('[data-avanzar]');
  if(avanzar){
    ev.stopPropagation();
    const p = DATA.pedidos.find(x => x.id === avanzar.dataset.avanzar);
    if(!p) return;
    const sig = (ESTADOS[p.estado] || {}).next;
    if(!sig) return;
    p.estado = sig;
    if(sig === 'entregado') p.tsEntrega = Date.now();
    putDoc('pedidos', p);
    toast('Pedido #' + p.num + ' · ' + ESTADOS[sig].txt);
    return;
  }

  const entregar = cl('[data-entregar]');
  if(entregar){
    const p = DATA.pedidos.find(x => x.id === entregar.dataset.entregar);
    if(!p) return;
    if(!p.pago){ abrirPedido(p.id); toast('Cargá cómo pagó antes de cerrar'); return; }
    p.estado = 'entregado'; p.tsEntrega = Date.now();
    putDoc('pedidos', p);
    toast('¡Entregado! ' + money(totalPedido(p)));
    return;
  }

  if(cl('[data-stop]')) return;   /* el link de WhatsApp no abre el editor */

  const card = cl('[data-pedido]');
  if(card){ abrirPedido(card.dataset.pedido); return; }

  /* editor de pedido */
  const add = cl('[data-add]');
  if(add){ addItem(add.dataset.add); return; }

  const cant = cl('[data-cant]');
  if(cant){ const p = cant.dataset.cant.split('|'); cambiarCant(Number(p[0]), Number(p[1])); return; }

  const salsa = cl('[data-salsa]');
  if(salsa){ const p = salsa.dataset.salsa.split('|'); tocarSalsa(Number(p[0]), p[1]); return; }

  const resetPr = cl('[data-resetprecio]');
  if(resetPr){
    const it = UI.borrador.items[Number(resetPr.dataset.resetprecio)];
    if(it && it.precioBase != null){ it.precio = it.precioBase; renderBorrador(); }
    return;
  }

  const limpia = cl('[data-limpiasalsa]');
  if(limpia){ const it = UI.borrador.items[Number(limpia.dataset.limpiasalsa)]; if(it){ it.salsas = []; renderBorrador(); } return; }

  const pago = cl('.btnPago');
  if(pago){ UI.borrador.pago = pago.dataset.pago; renderBorrador(); return; }

  const est = cl('.btnEstado');
  if(est){ UI.borrador.estado = est.dataset.estado; renderBorrador(); return; }

  if(cl('#btnGuardarPedido')){ guardarPedido(); return; }

  if(cl('#btnCompartirPedido')){ compartir(textoPedido(UI.borrador)); return; }

  if(cl('#btnBorrarPedido')){
    const p = UI.borrador;
    if(confirm('¿Borrar el pedido #' + p.num + ' de ' + (p.cliente || 'sin nombre') + '?')){
      delDoc('pedidos', p.id);
      cerrarSheet();
      toastDeshacer('Pedido #' + p.num + ' borrado', () => {
        putDoc('pedidos', p);
        toast('Pedido #' + p.num + ' recuperado');
      });
    }
    return;
  }

  if(cl('#btnDeshacer')){
    const fn = DESHACER;
    DESHACER = null;
    $('#toast').classList.add('hidden');
    if(fn) fn();
    return;
  }

  /* menú */
  if(cl('#btnNuevoProd')){ abrirProducto(); return; }
  const prod = cl('[data-prod]');
  if(prod){ abrirProducto(prod.dataset.prod); return; }
  const guardarPr = cl('#prGuardar');
  if(guardarPr){ guardarProducto(guardarPr.dataset.prid); return; }
  const delProd = cl('[data-delprod]');
  if(delProd){
    if(confirm('¿Borrar este producto del menú?')){ delDoc('productos', delProd.dataset.delprod); cerrarSheet(); }
    return;
  }

  /* caja */
  if(cl('#btnNuevoCosto')){ abrirCosto(); return; }
  if(cl('#coGuardar')){
    const concepto = $('#coConcepto').value.trim();
    const monto = Number($('#coMonto').value) || 0;
    if(!concepto || !monto) return toast('Completá concepto y monto');
    putDoc('costos', { id:uid(), jornada:UI.jornadaCaja || jornadaHoy(), concepto:concepto, monto:monto, ts:Date.now() });
    cerrarSheet(); toast('Costo agregado');
    return;
  }
  const delCosto = cl('[data-delcosto]');
  if(delCosto){
    const c = DATA.costos.find(x => x.id === delCosto.dataset.delcosto);
    if(!c) return;
    delDoc('costos', c.id);
    toastDeshacer(c.concepto + ' borrado', () => { putDoc('costos', c); toast('Costo recuperado'); });
    return;
  }

  if(cl('#btnCompartirCierre')){ compartir(textoCierreNoche(UI.jornadaCaja || jornadaHoy())); return; }
  if(cl('#btnCompartirMes')){ compartir(textoResumenMes(UI.mesCaja)); return; }

  const verCaja = cl('[data-caja]');
  if(verCaja){ UI.cajaVista = verCaja.dataset.caja; renderCaja(); return; }

  const cerrar = cl('[data-cerrar]');
  if(cerrar){ cerrarJornada(cerrar.dataset.cerrar); return; }

  const reabrir = cl('[data-reabrir]');
  if(reabrir){
    const c = cierreDe(reabrir.dataset.reabrir);
    if(c && confirm('¿Reabrir esta noche para poder seguir cargando o corregir?')){
      delDoc('cierres', c.id);
      toast('Noche reabierta');
    }
    return;
  }

  /* Desde el listado del mes se salta al detalle de esa noche. */
  const verNoche = cl('[data-vernoche]');
  if(verNoche){
    UI.jornadaCaja = verNoche.dataset.vernoche;
    UI.cajaVista = 'noche';
    renderCaja();
    window.scrollTo(0, 0);
    return;
  }

  /* ajustes */
  if(cl('#cfConectar')){
    guardarAjustes();
    /* Puede pegarse el link de invitacion, que ya trae codigo y configuracion. */
    const desdeLink = parseLinkConfig($('#cfFb').value);
    if(desdeLink){
      CFG.fb = desdeLink.fb;
      CFG.negocioId = desdeLink.n;
    } else {
      CFG.negocioId = $('#cfNegocio').value.trim();
      const fb = parseConfigFirebase($('#cfFb').value);
      if(!fb) return toast('No encontré la config de Firebase en ese texto');
      CFG.fb = fb;
      if(!CFG.negocioId) return toast('Poné un código de negocio');
    }
    saveLocal('config');
    actualizarManifiesto();
    conectarCloud().then(ok => { if(ok) cerrarSheet(); });
    return;
  }
  if(cl('#cfDesconectar')){ desconectarCloud(); cerrarSheet(); toast('Sincronización desactivada'); return; }

  if(cl('#cfCompartir')){
    const url = linkDeConfig();
    abrirSheet('Conectar otro dispositivo',
      '<div class="space-y-4">' +
        '<p class="text-sm text-zinc-300 leading-snug">Mandale este link al celular o la compu que quieras sumar. Al abrirlo queda conectado a los mismos pedidos, sin configurar nada.</p>' +
        '<div class="rounded-xl border border-ink-600 bg-ink-700 p-3 break-all font-mono text-[11px] text-zinc-300">' + esc(url) + '</div>' +
        '<div class="grid grid-cols-2 gap-2">' +
          '<button id="cpCopiar" class="py-3 rounded-xl bg-dr-500 text-ink-900 font-extrabold text-sm active:scale-95 transition">Copiar link</button>' +
          '<a href="https://wa.me/?text=' + encodeURIComponent('Link para conectar la app de Dr Chicken:\n' + url) + '" target="whatsapp" rel="noopener" class="py-3 rounded-xl border border-ink-600 font-bold text-sm text-center active:bg-ink-700 hover:bg-ink-700">Enviar por WhatsApp</a>' +
        '</div>' +
        '<p class="text-[11px] text-zinc-500 leading-snug">Este link es la llave de la caja: mandalo solo a los del local y no lo publiques en ningún lado. Si alguna vez se filtra, avisame y cambiamos el código del negocio.</p>' +
      '</div>');
    return;
  }

  if(cl('#cpCopiar')){
    const url = linkDeConfig();
    if(navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Link copiado'), () => toast('No se pudo copiar'));
    else toast('Copialo a mano del recuadro');
    return;
  }
  if(cl('#cfExportar')){ guardarAjustes(); exportarDatos(); return; }
  if(cl('#cfImportar')){ $('#cfFile').click(); return; }
  if(cl('#cfResetMenu')){
    if(confirm('¿Restaurar el menú original de Dr Chicken? Se pierden los cambios de precios.')){
      DATA.productos.slice().forEach(p => delDoc('productos', p.id));
      MENU_INICIAL.forEach((p, i) => putDoc('productos', Object.assign({ id:uid(), orden:i, activo:true }, p)));
      cerrarSheet(); toast('Menú restaurado');
    }
    return;
  }
  if(cl('#cfBorrarTodo')){
    if(confirm('¿Borrar TODOS los pedidos y costos? No se puede deshacer.')){
      DATA.pedidos.slice().forEach(p => delDoc('pedidos', p.id));
      DATA.costos.slice().forEach(c => delDoc('costos', c.id));
      cerrarSheet(); toast('Listo, quedó todo limpio');
    }
    return;
  }
});

document.addEventListener('change', ev => {
  const pr = ev.target.dataset && ev.target.dataset.precio;
  if(pr !== undefined && pr !== null && pr !== ''){
    const it = UI.borrador && UI.borrador.items[Number(pr)];
    if(it){
      const v = Math.max(0, Math.round(Number(ev.target.value) || 0));
      if(it.precioBase == null) it.precioBase = it.precio;
      it.precio = v;
      renderBorrador();
    }
    return;
  }
  if(ev.target.id === 'selJornada'){ UI.jornadaCaja = ev.target.value; renderCaja(); }
  if(ev.target.id === 'selMes'){ UI.mesCaja = ev.target.value; renderCaja(); }
  if(ev.target.id === 'cfFile' && ev.target.files[0]) importarDatos(ev.target.files[0]);
  if(ev.target.id === 'cfEnvio' || ev.target.id === 'cfMsg') guardarAjustes();
});

/* Completa teléfono y dirección al elegir un cliente ya conocido. */
document.addEventListener('input', ev => {
  if(ev.target.id !== 'inpCliente') return;

  }
});

/* ============================ INIT ============================ */

(function init(){
  loadLocal();

  /* Si la app ya estaba abierta, tocar el link solo cambia el hash y no recarga:
     sin esto, el dispositivo se quedaria sin configurar. */
  window.addEventListener('hashchange', () => {
    if(aplicarConfigDeLink()){ render(); actualizarManifiesto(); conectarCloud(); }
  });
  const vinoDeLink = aplicarConfigDeLink();
  UI.jornadaCaja = jornadaHoy();
  actualizarManifiesto();
  render();
  if(CFG.fb && CFG.negocioId) conectarCloud(!vinoDeLink); else pintarSync('off', 'Local');
})();
